<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de voces</title>
<link rel="icon" href="/img/icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lib/nes.css/nes.min.css">
<style>
  /* Solo acomodo: el aspecto viene de NES.css, pixelarticons y los sprites del juego */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #212529; color: #fff; font-family: 'Pixelify Sans', monospace; font-variant-ligatures: none; font-size: 17px; }
  .px { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.2em; }
  .px svg { width: 100%; height: 100%; display: block; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 4px solid #fff; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.3rem; color: #f7d51d; flex: 1; white-space: nowrap; }
  header progress { width: 180px !important; flex: 0 0 180px; height: 22px; margin: 0; }
  main { display: grid; grid-template-columns: 330px 1fr; min-height: 0; }
  aside { border-right: 4px solid #fff; overflow-y: auto; padding: 10px; }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .filtros .nes-btn { font-size: 0.8rem; padding: 2px 8px; }
  .linea { display: grid; grid-template-columns: 26px 1fr; gap: 6px; align-items: center; padding: 6px; cursor: pointer; border: 2px solid transparent; }
  .linea:hover { border-color: #666; }
  .linea.actual { border-color: #f7d51d; }
  .linea small { display: block; color: #aaa; font-size: 0.75rem; }
  .linea .ok { color: #92cc41; } .linea .no { color: #666; }
  section { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .prompter { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: start; margin: 0 !important; }
  .prompter img { width: 96px; height: 96px; image-rendering: pixelated; }
  .quien { color: #f7d51d; font-weight: 700; margin: 0 0 2px; }
  .animo { color: #aaa; font-size: 0.85rem; margin: 0 0 10px; }
  .texto { font-size: 1.55rem; line-height: 1.35; margin: 0; }
  .lectura { margin: 10px 0 0; color: #8ec5ff; font-size: 1rem; }
  .donde { color: #aaa; font-size: 0.85rem; margin: 8px 0 0; }
  .controles { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grande { font-size: 1.2rem; }
  #nivel { width: 100%; height: 22px; margin: 0; }
  #onda { width: 100%; height: 110px; display: block; background: #111; image-rendering: pixelated; }
  .estado { min-height: 1.4em; color: #aaa; }
  .estado.rojo { color: #e76e55; }
  .cuenta { font-size: 3rem; color: #e76e55; text-align: center; min-height: 0; }
  dialog { max-width: 620px; }
  pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
  kbd { font-family: inherit; color: #f7d51d; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { max-height: 32vh; border-right: 0; border-bottom: 4px solid #fff; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><i class="px" data-icono="speaker"></i> Estudio de voces · Hora Dorada</h1>
    <span id="avance">0 / 0</span>
    <progress id="barra" class="nes-progress is-success" value="0" max="1"></progress>
    <button class="nes-btn" id="b-probar"><i class="px" data-icono="play"></i> Probar en el juego</button>
    <button class="nes-btn is-warning" id="b-enviar"><i class="px" data-icono="upload"></i> Enviar al juego</button>
  </header>
  <main>
    <aside>
      <div class="filtros">
        <button class="nes-btn is-primary" data-filtro="todas">Todas</button>
        <button class="nes-btn" data-filtro="Gno">Gno</button>
        <button class="nes-btn" data-filtro="Narrador">Narrador</button>
        <button class="nes-btn" data-filtro="pendientes">Pendientes</button>
      </div>
      <div id="lista"></div>
    </aside>
    <section>
      <div class="nes-container is-dark is-rounded prompter">
        <img id="cara" src="" alt="">
        <div>
          <p class="quien" id="quien"></p>
          <p class="animo" id="animo"></p>
          <p class="texto" id="texto"></p>
          <p class="lectura" id="lectura"></p>
          <p class="donde" id="donde"></p>
        </div>
      </div>
      <div class="cuenta" id="cuenta"></div>
      <div class="controles">
        <button class="nes-btn is-error grande" id="b-grabar"><i class="px" data-icono="radio-on"></i> Grabar</button>
        <button class="nes-btn grande" id="b-escuchar"><i class="px" data-icono="play"></i> Escuchar</button>
        <button class="nes-btn" id="b-borrar"><i class="px" data-icono="trash"></i> Borrar</button>
        <span style="flex:1"></span>
        <button class="nes-btn" id="b-anterior"><i class="px" data-icono="chevron-left"></i> Anterior</button>
        <button class="nes-btn is-success" id="b-siguiente">Siguiente <i class="px" data-icono="chevron-right"></i></button>
      </div>
      <progress id="nivel" class="nes-progress is-error" value="0" max="100"></progress>
      <canvas id="onda" width="900" height="110"></canvas>
      <p class="estado" id="estado">Elige una frase y presiona <kbd>Grabar</kbd> (o la tecla <kbd>R</kbd>). <kbd>Espacio</kbd> escucha, <kbd>←</kbd> <kbd>→</kbd> cambian de frase.</p>
      <label><input type="checkbox" class="nes-checkbox is-dark" id="c-cuenta" checked><span>Cuenta regresiva de 3 segundos</span></label>
      <label><input type="checkbox" class="nes-checkbox is-dark" id="c-avanzar" checked><span>Al terminar, escuchar la toma</span></label>
    </section>
  </main>
</div>

<dialog class="nes-dialog is-dark is-rounded" id="d-enviar">
  <form method="dialog">
    <p class="title">Enviar al juego</p>
    <p id="d-resumen"></p>
    <label><input type="checkbox" class="nes-checkbox is-dark" id="c-agudo"><span>Subir un poco el tono de Gno (voz de personaje)</span></label>
    <pre id="d-informe"></pre>
    <menu class="dialog-menu" style="display:flex; gap:10px; padding:0; margin-top:12px">
      <button class="nes-btn" value="cancelar">Cerrar</button>
      <button class="nes-btn is-warning" id="b-confirmar" value="">Enviar</button>
    </menu>
  </form>
</dialog>

<script type="module">
const $ = id => document.getElementById(id);
const CARAS = { Gno: '/assets/sprites/personajes/flam_cara.png', Narrador: '/assets/sprites/personajes/estatua_cara.png' };
const ANIMO = { Gno: 'Curioso, alegre y un poco nervioso. Voz ligera, con energía.', Narrador: 'Calmado y sabio, como quien cuenta una leyenda. Voz pausada y grave.' };
const donde = c => c.startsWith('historia') ? 'Suena en la historia del inicio.' : c.startsWith('nivel') ? `Suena al presentar el ${c.replace('nivel', 'nivel ')}.`
  : ({ controles: 'Suena al empezar el nivel 1.', controles_otros: 'Suena al empezar el nivel 1 si el jugador cambió las teclas.', hola: 'Suena al prender la voz en el menú.', gano3: 'Suena al ganar con 3 estrellas.', gano: 'Suena al ganar.', perdio: 'Suena al perder.' })[c] || '';

// Íconos de pixelarticons (MIT)
async function iconos(raiz = document) {
  for (const el of raiz.querySelectorAll('[data-icono]:not([data-ok])')) {
    el.dataset.ok = 1;
    el.innerHTML = await (await fetch(`/lib/pixelarticons/${el.dataset.icono}.svg`)).text().catch(() => '');
  }
}

let lineas = [], actual = 0, filtro = 'todas';
let micro = null, grabadora = null, partes = [], analizador = null, ctxAudio = null, grabando = false, tomaURL = null, reproductor = null;

async function cargar() {
  lineas = await (await fetch('/api/lineas')).json();
  pintarLista(); mostrar(0); iconos();
}
function pintarLista() {
  const hechas = lineas.filter(l => l.grabada).length;
  $('avance').textContent = `${hechas} / ${lineas.length} grabadas`;
  $('barra').max = lineas.length; $('barra').value = hechas;
  $('lista').innerHTML = lineas.map((l, i) => {
    if (filtro === 'pendientes' && l.grabada) return '';
    if ((filtro === 'Gno' || filtro === 'Narrador') && l.quien !== filtro) return '';
    return `<div class="linea ${i === actual ? 'actual' : ''}" data-i="${i}">
      <span class="${l.grabada ? 'ok' : 'no'}"><i class="px" data-icono="${l.grabada ? 'check' : 'radio-on'}"></i></span>
      <span><b>${l.clave}</b> <small>${l.quien} · ${l.texto.slice(0, 48)}${l.texto.length > 48 ? '…' : ''}</small></span></div>`;
  }).join('');
  for (const d of $('lista').querySelectorAll('.linea')) d.onclick = () => mostrar(+d.dataset.i);
  iconos($('lista'));
}
async function mostrar(i) {
  if (grabando) return;
  actual = Math.max(0, Math.min(lineas.length - 1, i));
  const l = lineas[actual];
  $('cara').src = CARAS[l.quien]; $('quien').textContent = l.quien; $('animo').textContent = ANIMO[l.quien];
  $('texto').textContent = l.texto;
  const lectura = l.lectura.replace(/\.\.\./g, '…').trim();
  $('lectura').textContent = lectura !== l.texto.trim() ? 'Cómo leerlo: ' + l.lectura : '';
  $('donde').textContent = donde(l.clave);
  pintarLista();
  tomaURL = null; dibujarOnda(null);
  if (l.grabada) {
    const r = await fetch(`/api/toma/${l.clave}?t=${Date.now()}`);
    if (r.ok) { const b = await r.blob(); tomaURL = URL.createObjectURL(b); dibujarOnda(b); }
  }
  estado(l.grabada ? 'Esta frase ya tiene una toma. Escúchala o vuelve a grabar.' : 'Lista para grabar.');
}
function estado(t, rojo = false) { $('estado').textContent = t; $('estado').classList.toggle('rojo', rojo); }

async function prepararMicro() {
  if (micro) return true;
  try {
    micro = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    ctxAudio = new AudioContext();
    analizador = ctxAudio.createAnalyser(); analizador.fftSize = 1024;
    ctxAudio.createMediaStreamSource(micro).connect(analizador);
    medir();
    return true;
  } catch (e) { estado('No pude usar el micrófono. Revisa que la app tenga permiso y que haya un micrófono conectado.', true); return false; }
}
function medir() {
  const datos = new Float32Array(analizador.fftSize);
  const paso = () => { analizador.getFloatTimeDomainData(datos); let m = 0; for (const v of datos) m = Math.max(m, Math.abs(v)); $('nivel').value = Math.min(100, m * 140); requestAnimationFrame(paso); };
  paso();
}
const espera = ms => new Promise(r => setTimeout(r, ms));
async function grabar() {
  if (grabando) return detener();
  if (!(await prepararMicro())) return;
  if (ctxAudio.state === 'suspended') await ctxAudio.resume();
  if ($('c-cuenta').checked) { for (const n of [3, 2, 1]) { $('cuenta').textContent = n; await espera(650); } $('cuenta').textContent = ''; }
  const tipos = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  const tipo = tipos.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  grabadora = new MediaRecorder(micro, tipo ? { mimeType: tipo } : undefined);
  partes = [];
  grabadora.ondataavailable = e => { if (e.data.size) partes.push(e.data); };
  grabadora.onstop = guardar;
  grabadora.start();
  grabando = true;
  const t0 = performance.now();
  const reloj = () => { if (!grabando) return; estado(`● Grabando… ${((performance.now() - t0) / 1000).toFixed(1)} s  (R o Detener para terminar)`, true); requestAnimationFrame(reloj); };
  reloj();
  $('b-grabar').innerHTML = '<i class="px" data-icono="close"></i> Detener'; iconos($('b-grabar').parentNode);
}
function detener() { if (grabadora && grabando) { grabando = false; grabadora.stop(); } }
async function guardar() {
  $('b-grabar').innerHTML = '<i class="px" data-icono="radio-on"></i> Grabar'; iconos($('b-grabar').parentNode);
  const tipo = (grabadora.mimeType || 'audio/webm').split(';')[0];
  const b = new Blob(partes, { type: tipo });
  const l = lineas[actual];
  estado('Guardando la toma…');
  const r = await fetch(`/api/toma/${l.clave}`, { method: 'POST', headers: { 'Content-Type': tipo }, body: b });
  if (!r.ok) return estado('No se pudo guardar la toma.', true);
  l.grabada = true; tomaURL = URL.createObjectURL(b);
  pintarLista(); dibujarOnda(b);
  estado(`Toma guardada (${(b.size / 1024).toFixed(0)} KB). Escúchala; si te gusta, pasa a la siguiente.`);
  if ($('c-avanzar').checked) escuchar();
}
function escuchar() {
  if (!tomaURL) return estado('Esta frase todavía no tiene toma.');
  if (reproductor) reproductor.pause();
  reproductor = new Audio(tomaURL); reproductor.play();
}
async function borrar() {
  const l = lineas[actual];
  if (!l.grabada) return;
  await fetch(`/api/toma/${l.clave}`, { method: 'DELETE' });
  l.grabada = false; tomaURL = null; dibujarOnda(null); pintarLista(); estado('Toma borrada.');
}
async function dibujarOnda(blob) {
  const cv = $('onda'), g = cv.getContext('2d');
  g.fillStyle = '#111'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#333'; g.fillRect(0, cv.height / 2, cv.width, 1);
  if (!blob) return;
  try {
    const ctx = ctxAudio || new AudioContext();
    const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
    const d = buf.getChannelData(0), paso = Math.ceil(d.length / cv.width);
    g.fillStyle = '#92cc41';
    for (let x = 0; x < cv.width; x++) {
      let mn = 1, mx = -1;
      for (let k = x * paso; k < Math.min(d.length, (x + 1) * paso); k++) { mn = Math.min(mn, d[k]); mx = Math.max(mx, d[k]); }
      g.fillRect(x, (1 - mx) * cv.height / 2, 1, Math.max(1, (mx - mn) * cv.height / 2));
    }
    g.fillStyle = '#aaa'; g.font = '14px "Pixelify Sans"'; g.fillText(`${buf.duration.toFixed(1)} s`, 8, 18);
  } catch (e) { /* formato que el navegador no decodifica: se puede escuchar igual */ }
}

async function abrirEnviar() {
  const hechas = lineas.filter(l => l.grabada).length;
  $('d-resumen').textContent = `Tienes ${hechas} de ${lineas.length} frases grabadas. Se van a limpiar (silencios y volumen) y se pondrán en el juego. Las que falten se quedan con la voz de Piper.`;
  $('d-informe').textContent = '';
  $('b-confirmar').disabled = hechas === 0;
  $('d-enviar').showModal();
}
async function enviar(e) {
  e.preventDefault();
  $('b-confirmar').disabled = true;
  $('d-informe').textContent = 'Procesando…';
  const r = await fetch('/api/enviar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gnoAgudo: $('c-agudo').checked }) });
  const j = await r.json();
  $('d-informe').textContent = (j.informe || 'Listo.') + '\n¡Listo! Usa "Probar en el juego" para escucharlas.';
  $('b-confirmar').disabled = false;
}

$('b-grabar').onclick = grabar;
$('b-escuchar').onclick = escuchar;
$('b-borrar').onclick = borrar;
$('b-anterior').onclick = () => mostrar(actual - 1);
$('b-siguiente').onclick = () => mostrar(actual + 1);
$('b-enviar').onclick = abrirEnviar;
$('b-confirmar').onclick = enviar;
$('b-probar').onclick = () => window.open(`/index.html?todo&v=${Date.now()}`, '_blank');
for (const b of document.querySelectorAll('[data-filtro]')) b.onclick = () => {
  filtro = b.dataset.filtro;
  for (const o of document.querySelectorAll('[data-filtro]')) o.classList.toggle('is-primary', o === b);
  pintarLista();
};
addEventListener('keydown', e => {
  if ($('d-enviar').open) return;
  if (e.code === 'KeyR') { e.preventDefault(); grabar(); }
  else if (e.code === 'Space') { e.preventDefault(); escuchar(); }
  else if (e.code === 'ArrowRight') mostrar(actual + 1);
  else if (e.code === 'ArrowLeft') mostrar(actual - 1);
});
cargar();
</script>
</body>
</html>
