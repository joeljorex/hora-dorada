    <g fill="#ffffff"><ellipse cx="0" cy="-62" rx="7" ry="16"/><ellipse cx="0" cy="-62" rx="16" ry="7"/><ellipse cx="0" cy="-62" rx="12" ry="5" transform="rotate(45 0 -62)"/><ellipse cx="0" cy="-62" rx="12" ry="5" transform="rotate(-45 0 -62)"/></g>
