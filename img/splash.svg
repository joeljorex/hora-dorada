  <!-- saguaros -->
  <g fill="#3d2a4a" opacity="0.9">
    <rect x="1040" y="300" width="26" height="160" rx="13"/><rect x="1010" y="350" width="18" height="60" rx="9"/><rect x="1010" y="395" width="40" height="18" rx="9"/>
    <rect x="1076" y="330" width="18" height="70" rx="9"/><rect x="1056" y="385" width="38" height="18" rx="9"/>
