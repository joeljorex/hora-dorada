    <ellipse cx="-3" cy="-58" rx="3.5" ry="5" fill="#2a1d2e"/><ellipse cx="11" cy="-58" rx="3.5" ry="5" fill="#2a1d2e"/>
    <circle cx="-9" cy="-50" r="3" fill="#ff8c78" opacity="0.6"/><circle cx="17" cy="-50" r="3" fill="#ff8c78" opacity="0.6"/>
