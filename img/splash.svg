  </g>
  <!-- sombra larga de Gno -->
  <path d="M560 520 L60 548 Q40 552 60 560 L560 548 Z" fill="#3b1f4f" opacity="0.55"/>
  <circle cx="52" cy="553" r="16" fill="#3b1f4f" opacity="0.55"/>
