  <rect width="1200" height="630" fill="url(#cielo)"/>
  <circle cx="930" cy="420" r="220" fill="url(#brillo)"/>
  <circle cx="930" cy="420" r="85" fill="#fff0b3"/>
  <path d="M0 420 L120 380 L230 405 L360 350 L470 395 L600 360 L720 400 L860 370 L1000 395 L1100 365 L1200 390 L1200 470 L0 470 Z" fill="#7a3f6b" opacity="0.75"/>
