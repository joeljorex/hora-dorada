<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Baloo 2', 'Trebuchet MS', sans-serif">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1f4f"/>
      <stop offset="0.45" stop-color="#c4465a"/>
      <stop offset="0.75" stop-color="#ff9a4a"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffc857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c27a"/>
      <stop offset="1" stop-color="#c98a4e"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.5" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#ff8c42"/>
