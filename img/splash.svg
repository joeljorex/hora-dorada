    <path d="M-36 0 Q0 10 36 0 Q24 -60 3 -118 Q0 -122 -3 -118 Q-24 -60 -36 0 Z" fill="#d9774a" stroke="#2a1d2e" stroke-width="4" stroke-linejoin="round"/>
